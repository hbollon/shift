# Shift — work-hours tracker for Noctalia.
# Design: docs/specs/0001-shift-v1.md (repository root).
#
# core      -> headless service, single source of truth (state, signals, persistence)
# bar       -> bar widget, thin client of the core snapshot
# dashboard -> panel, thin client: dashboard, history and editors
# tile      -> control-center shortcut, check in / check out

id           = "hbollon/shift"
name         = "Shift"
version      = "0.0.1"
plugin_api   = 32
author       = "hbollon"
license      = "MIT"
icon         = "briefcase"
description  = "Track your work hours: one-click check in/out, smart automation, daily target and overtime balance."
tags         = ["bar", "panel", "shortcut", "service", "productivity", "time"]
dependencies = []

# --- Settings ------------------------------------------------------------------

[[setting]]
key             = "weekly_hours"
type            = "double"
label_key       = "settings.weekly_hours.label"
description_key = "settings.weekly_hours.description"
default         = 35
min             = 0
max             = 100

[[setting]]
key             = "work_week"
type            = "select"
label_key       = "settings.work_week.label"
description_key = "settings.work_week.description"
default         = "mon_fri"
options = [
  { value = "mon_fri", label_key = "settings.work_week.mon_fri" },
  { value = "mon_sat", label_key = "settings.work_week.mon_sat" },
  { value = "custom", label_key = "settings.work_week.custom" },
]

[[setting]]
key          = "workday_mon"
type         = "bool"
label_key    = "settings.workday_mon.label"
default      = true
visible_when = { key = "work_week", values = ["custom"] }

[[setting]]
key          = "workday_tue"
type         = "bool"
label_key    = "settings.workday_tue.label"
default      = true
visible_when = { key = "work_week", values = ["custom"] }

[[setting]]
key          = "workday_wed"
type         = "bool"
label_key    = "settings.workday_wed.label"
default      = true
visible_when = { key = "work_week", values = ["custom"] }

[[setting]]
key          = "workday_thu"
type         = "bool"
label_key    = "settings.workday_thu.label"
default      = true
visible_when = { key = "work_week", values = ["custom"] }

[[setting]]
key          = "workday_fri"
type         = "bool"
label_key    = "settings.workday_fri.label"
default      = true
visible_when = { key = "work_week", values = ["custom"] }

[[setting]]
key          = "workday_sat"
type         = "bool"
label_key    = "settings.workday_sat.label"
default      = false
visible_when = { key = "work_week", values = ["custom"] }

[[setting]]
key          = "workday_sun"
type         = "bool"
label_key    = "settings.workday_sun.label"
default      = false
visible_when = { key = "work_week", values = ["custom"] }

[[setting]]
key             = "day_start_hour"
type            = "int"
label_key       = "settings.day_start_hour.label"
description_key = "settings.day_start_hour.description"
default         = 4
min             = 0
max             = 12
advanced        = true

[[setting]]
key             = "duration_format"
type            = "select"
label_key       = "settings.duration_format.label"
description_key = "settings.duration_format.description"
default         = "colon"
options = [
  { value = "colon", label_key = "settings.duration_format.colon" },
  { value = "units", label_key = "settings.duration_format.units" },
  { value = "decimal", label_key = "settings.duration_format.decimal" },
]

# --- Entries -------------------------------------------------------------------

[[service]]
id    = "core"
entry = "core.luau"

[[widget]]
id    = "bar"
entry = "bar.luau"

[[widget.setting]]
key             = "style"
type            = "select"
label_key       = "settings.style.label"
description_key = "settings.style.description"
default         = "full"
options = [
  { value = "full", label_key = "settings.style.full" },
  { value = "compact", label_key = "settings.style.compact" },
  { value = "minimal", label_key = "settings.style.minimal" },
]

[[widget.setting]]
key             = "value"
type            = "select"
label_key       = "settings.value.label"
default         = "worked"
options = [
  { value = "worked", label_key = "settings.value.worked" },
  { value = "remaining", label_key = "settings.value.remaining" },
]

[[widget.setting]]
key             = "when_off"
type            = "select"
label_key       = "settings.when_off.label"
description_key = "settings.when_off.description"
default         = "dim"
options = [
  { value = "show", label_key = "settings.when_off.show" },
  { value = "dim", label_key = "settings.when_off.dim" },
  { value = "hide", label_key = "settings.when_off.hide" },
]

[[panel]]
id              = "dashboard"
entry           = "dashboard.luau"
width           = 400
height          = 660
placement       = "attached"
position        = "auto"
open_near_click = true
capture_keys    = ["ctrl+z"]

[[shortcut]]
id    = "tile"
entry = "tile.luau"
