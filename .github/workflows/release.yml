name: Release

# Publishes a release, with notes generated by git-cliff from the Conventional Commits since the previous tag.
#
# - From the Actions tab (or `gh workflow run release.yml -f version=auto`): prepares the release on the default
#   branch (version, catalog, CHANGELOG.md), commits it as github-actions[bot], tags it, then publishes it. `auto`
#   derives the version from the commits: feat → minor, fix and perf → patch, `!` → major.
# - From a pushed vX.Y.Z tag, on a commit already prepared with `make prepare-release`: publishes it.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z), or auto to derive it from the commits"
        required: true
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # the history and tags git-cliff reads
      - name: Install toolchain
        run: make tools
      - name: Choose the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          version="$INPUT"
          if [[ "$version" == auto ]]; then
            version="$(.tools/bin/git-cliff --bumped-version 2>/dev/null)"
          fi
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid version \"$version\""; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists: nothing to release since it, or pick another version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set the version, catalog and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make prepare-release VERSION="$VERSION"
      - name: Run checks
        run: make test analyze validate catalog-check
      - name: Commit, tag and push
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shift/plugin.toml catalog.toml CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the release
    needs: prepare
    # A tag pushed by the prepare job does not start another run, so this job publishes it here.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}
          fetch-depth: 0
      - name: Install toolchain
        run: make tools
      - name: Check the tag matches the prepared version
        run: |
          version="${TAG#v}"
          grep -qE "^version += \"$version\"$" shift/plugin.toml \
            || { echo "::error::shift/plugin.toml is not at version $version (make prepare-release VERSION=$version)"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no $version section (make prepare-release VERSION=$version)"; exit 1; }
      - name: Run checks
        if: github.event_name == 'push'
        run: make test analyze validate catalog-check
      - name: Generate release notes
        run: .tools/bin/git-cliff --current --strip all --output "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "Shift $TAG" --notes-file "$RUNNER_TEMP/notes.md"
