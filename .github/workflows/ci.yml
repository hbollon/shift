name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: make tools
      - name: Run Luau tests
        run: make test

  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: make tools
      - name: Type-check and lint
        run: make analyze

  validate:
    name: Store validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: make tools
      - name: Validate against community-plugins rules
        run: make validate
      - name: Check catalog is up to date
        run: make catalog-check

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the pull request's commits and its base branch
      - name: Check commit messages and the pull request title
        env:
          BASE: origin/${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-commits.sh "$BASE" "$TITLE"
